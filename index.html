<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Yuxiang Liu — CS180 Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #faf9f7; --surface: #ffffff; --ink: #1c1b1a; --muted: #6b6864;
      --line: #e7e4df; --accent: #1d4ed8; --accent-soft: #eef2ff;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14130f; --surface: #1c1b18; --ink: #ece9e3; --muted: #a09c94;
        --line: #302e29; --accent: #8bb0ff; --accent-soft: #1e2333;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.5);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--sans); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 6rem 1.5rem 4rem; }
    .eyebrow {
      font-size: .8rem; letter-spacing: .18em; text-transform: uppercase;
      color: var(--accent); font-weight: 600; margin: 0 0 1rem;
    }
    h1 {
      font-family: var(--serif); font-weight: 600;
      font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1.1;
      margin: 0 0 .8rem; letter-spacing: -.01em;
    }
    .intro { color: var(--muted); font-size: 1.15rem; max-width: 52ch; margin: 0 0 3rem; }
    h2 {
      font-family: var(--serif); font-size: 1.1rem; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
      margin: 0 0 1.2rem;
    }
    .projects { display: grid; gap: 1rem; }
    a.card {
      display: flex; align-items: baseline; gap: 1rem;
      text-decoration: none; color: var(--ink);
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 14px; padding: 1.3rem 1.5rem;
      box-shadow: var(--shadow);
      transition: border-color .2s, transform .2s;
    }
    a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card .idx {
      font-family: var(--serif); font-size: 1.4rem; color: var(--accent);
      font-weight: 600; min-width: 2.5rem;
    }
    .card .body { flex: 1; }
    .card .title { font-size: 1.15rem; font-weight: 600; margin: 0 0 .2rem; }
    .card .desc { color: var(--muted); font-size: .95rem; margin: 0; }
    .card .arrow { color: var(--muted); font-size: 1.2rem; }
    footer { color: var(--muted); font-size: .9rem; margin-top: 3.5rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">UC Berkeley · CS180 · Fall 2026</p>
    <h1>Yuxiang Liu</h1>
    <p class="intro">Coursework and projects for CS180 — Intro to Computer Vision &amp; Computational Photography.</p>

    <h2>Projects</h2>
    <div class="projects">
      <a class="card" href="./proj0/index.html">
        <span class="idx">00</span>
        <span class="body">
          <span class="title">Becoming Friends with Your Camera</span>
          <p class="desc">Distance, zoom, and perspective — selfies, façade compression, and a dolly zoom.</p>
        </span>
        <span class="arrow">→</span>
      </a>
    </div>

    <footer>© 2026 Yuxiang Liu</footer>
  </div>
</body>
</html>
